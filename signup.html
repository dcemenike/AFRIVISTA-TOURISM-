<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Begin Your Journey | AfriVista</title>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="signup-viewport">
        <!-- Abstract Background Sculpting Elements -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <div class="sculpt-card">
            <!-- Top Premium Branding Header -->
            <header class="brand-header">
                <div class="brand-badge">AFRIVISTA TOURISM</div>
                <h1>Create Your Account</h1>
                <p>Curate your routes, track pristine game drives, and archive deep cultural experiences.</p>
            </header>

            <!-- Traditional Core Fields Area -->
            <form class="interactive-form" onsubmit="event.preventDefault();">
                <div class="form-row">
                    <div class="input-block">
                        <label for="firstname">First Name</label>
                        <div class="field-container">
                            <input type="text" id="firstname" placeholder="John" required>
                            <span class="focus-line"></span>
                        </div>
                    </div>
                    <div class="input-block">
                        <label for="lastname">Last Name</label>
                        <div class="field-container">
                            <input type="text" id="lastname" placeholder="Doe" required>
                            <span class="focus-line"></span>
                        </div>
                    </div>
                </div>

                <div class="input-block">
                    <label for="email">Email Address</label>
                    <div class="field-container">
                        <input type="email" id="mail" placeholder="name@domain.com" required>
                        <span class="focus-line"></span>
                    </div>
                </div>

                <div class="input-block">
                    <label for="password">Password</label>
                    <div class="field-container">
                        <div id="password-wrapper">
                            <input class="password-wrapper" type="password" id="pass" placeholder="••••••••••••" required>
                            <i id="toggleIcon" class="fa-solid fa-eye"></i>
                        </div>
                        <span class="focus-line"></span>
                    </div>
                    <span class="field-hint"  id="error-box"></span>
                </div>

                <!-- Terms Assertion check -->
                <!-- <label class="custom-assert">
                    <input type="checkbox" required>
                    <span class="box-target"></span>
                    <span class="assert-text">I agree to the terms of service and private exploration policies.</span>
                </label> -->

                <!-- Primary Call To Action Button -->
                <button type="submit" id="submit-btn" class="action-submit">
                    <span>Initialize Profile</span>
                    <i class="fa-solid fa-arrow-right-long"></i>
                </button>
            </form>

            <!-- Decorative Visual Dividers -->
            <div class="matrix-divider">
                <span class="line"></span>
                <span class="caption">or</span>
                <span class="line"></span>
            </div>

            <!-- Google Integration Layer (Positioned at bottom) -->
            <footer class="federated-options">
                <button class="google-auth-trigger" id="continueWithGoogle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22px" height="22px">
                        <path fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                        <path fill="#4285F4"
                            d="M46.5 24c0-1.55-.15-3.24-.47-4.77H24v9.03h12.75c-.53 2.87-2.14 5.31-4.59 6.96l7.14 5.53C43.46 36.55 46.5 30.95 46.5 24z" />
                        <path fill="#FBBC05"
                            d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z" />
                        <path fill="#34A853"
                            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.14-5.53c-2.1 1.42-4.78 2.31-8.75 2.31-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                    </svg>
                    <span>Sign up with Google</span>
                </button>

                <p class="switch-context">
                    Already a member? <a href="signin.html  ">Sign in</a>
                </p>
            </footer>
        </div>
    </div>

</body>
<script src="signup.js" type="module"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</html>
