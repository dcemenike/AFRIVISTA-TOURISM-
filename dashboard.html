<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AfriVista</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="dashboard-container">
        <!-- 1. SIDEBAR -->
        <aside class="sidebar">
            <h2>AfriVista</h2>
            <nav>
                <a href="#" class="active">Dashboard</a>
                <a href="#">My Trips</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <header>
                <h1>Welcome Back, <span id="show"></span></h1>
            </header>

            <!-- THE GRID CONTAINER -->
            <div class="grid-container">
                <div class="row g-4">
                    
                    <!-- LEFT COLUMN: Tour Packages (Takes up 2/3 width) -->
                    <div class="col-12 col-md-8">
                        <h3 class="h6 fw-bold text-uppercase text-muted mb-4 tracking-wider">
                            <i class="bi bi-compass-fill text-primary me-2"></i>Curated Tour Packages
                        </h3>
                        
                        <!-- Your loop will drop horizontal cards inside here -->
                        <div id="tours-container" class="d-flex flex-column gap-3"></div>
                    </div>

                    <!-- RIGHT COLUMN: Stacked Widgets (Takes up 1/3 width) -->
                    <div class="col-12 col-md-4">
                        <h3 class="h6 fw-bold text-uppercase text-muted mb-4 tracking-wider">
                            <i class="bi bi-activity text-primary me-2"></i>Utilities
                        </h3>
                        
                        <div class="d-flex flex-column gap-4">
                            
                            <!-- Card 2: Weather Card -->
                            <div class="card weather-card m-0 border-0 shadow-sm p-4 bg-white rounded-3">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h4 class="h6 fw-bold text-dark mb-0" id="cityName">Destination Weather</h4>
                                    <i class="bi bi-cloud-sun text-info fs-5"></i>
                                </div>
                                <div class="py-2">
                                    <img src="" alt="" id="weatherIcon">
                                    <p class="temp display-5 fw-bold text-dark mb-1" id="dashTemp">--°C</p>
                                    <p id="dashCondition" class="text-muted small mb-0">Fetching forecast...</p>
                                </div>
                            </div>

                            <!-- Card 3: Payment Gateway Card -->
                            <div class="card payment-card m-0 border-0 shadow-sm p-4 bg-white rounded-3">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h4 class="h6 fw-bold text-dark mb-0">Checkout</h4>
                                    <i class="bi bi-shield-check text-success fs-5" ></i>
                                </div>
                                <p class="text-muted small mb-4">Ready to lock in your custom African travel itinerary?</p>
                                <button id="checkoutBtn" class="pay-btn btn btn-dark w-100 py-2.5 rounded-3 fw-bold small">
                                    Pay Now ($1,200)
                                </button>
                                <p id="paymentStatus" class="mt-3 mb-0 text-center text-muted small"></p>
                            </div>

                        </div>
                    </div> <!-- End Right Column -->

                </div> <!-- End Row -->
            </div>
        </main>
    </div>

</body>
<script type="module" src="dashboard.js"></script>
</html>
